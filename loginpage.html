<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>NBDCo |login</title>
    <link rel="stylesheet" href="layoutNDC/login.css">
</head>
<body>
    <center>
<div class="wrapper">
    <div class="log">
    <img src="resource/LOGSMALhin 2.png" alt="NBDCo">
    </div>
        <div class="passcode">
            <div style="max-width:320px;margin:0 auto;">
                <form id="login-form">
                    <input type="text" placeholder="Username or email" id="username" required>
                    <input type="password" placeholder="Password" id="password" required>
                    <button type="submit">Sign in</button>
                </form>

                <hr>

                <form id="register-form">
                    <input type="text" placeholder="Choose username" id="reg_username" required>
                    <input type="email" placeholder="Email (optional)" id="reg_email">
                    <input type="password" placeholder="Choose password" id="reg_password" required>
                    <button type="submit">Register</button>
                </form>

            </div>
        </div>
<footer>
    <p>All right &copy; Nigeria Bereweries Yola Branch.</p>
</footer>

    </center>
    <script src="scriptNDC/login.js"></script>
</body>
</html>
